name: PR Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    uses: nikolareljin/ci-helpers/.github/workflows/pr-gate.yml@production
    with:
      python_version: "3.11"
      check_release_tag: true
      release_branch: ${{ github.head_ref }}
      install_command: "pip install -e '.[dev]'"
      lint_command: "ruff check scripts/ compression/ benchmarks/ mobile_deployment/ tests/ && black --check scripts/ compression/ benchmarks/ mobile_deployment/ tests/"
      test_command: "pytest -q tests/"
      build_command: ""
