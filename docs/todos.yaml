# ShrinkLLM — GitHub Issue TODO List
# Machine-readable format for auto-generating GitHub issues.
# Feed this back to the AI to create issues via: gh issue create

todos:
  - id: SHRINK-001
    title: "Implement ONNX export for encoder-decoder models (TrOCR)"
    description: |
      Create scripts/export_to_onnx.py with support for seq2seq models (TrOCR) and
      encoder-only models (BERT, ViT). Handle dynamic axes for variable-length inputs
      and validate exported model with ORT inference check.
    acceptance_criteria:
      - TrOCR-base exports successfully to ONNX opset 17
      - Dynamic axes set correctly for batch_size and sequence_length
      - Exported model validated with sample inputs; max numerical diff < 1e-4
      - CLI --help complete and all args documented
      - tests/test_export.py passes
    dependencies: []
    labels: [pipeline, onnx, priority-high, phase-1]
    milestone: "Phase 1: Model Selection + ONNX Export"
    estimate: "3d"

  - id: SHRINK-002
    title: "Implement dynamic INT8 quantization"
    description: |
      Implement dynamic INT8 quantization in scripts/quantize.py using onnxruntime's
      quantize_dynamic. Must support skip_ops to protect sensitive layers.
    acceptance_criteria:
      - Dynamic INT8 produces valid ONNX model from TrOCR-base ONNX export
      - Size reduction ≥ 3.5× vs FP32 input
      - Model validates with ORT inference
      - tests/test_quantization.py passes
    dependencies: [SHRINK-001]
    labels: [compression, quantization, priority-high, phase-2]
    milestone: "Phase 2: Quantization + Pruning"
    estimate: "2d"

  - id: SHRINK-003
