      per task (OCR, legal, audio).
    acceptance_criteria:
      - Static INT8 quantization produces valid ONNX model
      - Calibration dataset loading works for all three tasks
      - Accuracy drop on IIIT-5K ≤ 1% vs FP32 baseline
      - Unit test passes
    dependencies: [SHRINK-002]
    labels: [compression, quantization, phase-2]
    milestone: "Phase 2: Quantization + Pruning"
    estimate: "4d"

