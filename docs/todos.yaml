    acceptance_criteria:
      - Head importance scores computed correctly
      - Bottom-K% heads zeroed out
      - Short fine-tune loop runs after pruning
      - Parameter count reduced by ≥ 20%
      - tests/test_pruning.py passes
    dependencies: [SHRINK-001]
    labels: [compression, pruning, phase-2]
    milestone: "Phase 2: Quantization + Pruning"
    estimate: "5d"

