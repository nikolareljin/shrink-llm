      - DistillationTrainer trains for N epochs without crash
      - Student reaches ≥ 90% of teacher accuracy on held-out eval set
      - tests/test_distillation.py passes
    dependencies: [SHRINK-001]
    labels: [distillation, training, priority-high, phase-3]
    milestone: "Phase 3: Distillation + Fine-tuning"
    estimate: "7d"

