    acceptance_criteria:
      - GPTQ quantization runs on Phi-3-mini
      - Output model size < 800 MB
      - Legal task F1 ≥ 80% on CUAD eval set
    dependencies: [SHRINK-001]
    labels: [compression, quantization, llm, phase-2]
    milestone: "Phase 2: Quantization + Pruning"
    estimate: "5d"

  - id: SHRINK-005
