# OCR Pipeline Configuration — ShrinkLLM
# Teacher: TrOCR-Large | Student: TrOCR-Base → INT8

task: ocr
model: microsoft/trocr-base-printed
teacher: microsoft/trocr-large-printed

onnx_opset: 17

# convert_coreml is omitted: coremltools >= 6 does not accept ONNX input, so the stage raises
# immediately (SHRINK-020, docs/reviews/codebase-audit.md CM1). Add it back once that lands.
stages:
  - prune
  - distill
  - export
  - quantize
  - convert_tflite
  - convert_onnx_mobile
  - benchmark

quantization:
  precision: int8
  mode: dynamic
  skip_ops:
    - Softmax
    - LayerNormalization

pruning:
  method: attention_heads
  sparsity: 0.25
  finetune_epochs: 2

distillation:
  temperature: 6.0
  alpha: 0.1
  beta: 0.9
  gamma: 0.0
  epochs: 8
  batch_size: 16
  lr: 3e-5
  fp16: true

mobile:
  android:
    runtime: tflite
    quantization: fp16
  ios:
    deployment_target: iOS16
    compute_units: ALL
    quantization: fp16

benchmark:
  runtime: onnxruntime
  warmup_runs: 10
  benchmark_runs: 100
  dataset: datasets/ocr/eval/

success_criteria:
  max_cer: 0.05
  max_size_mb: 100
  max_latency_ms: 200
  max_accuracy_drop_pct: 3.0
