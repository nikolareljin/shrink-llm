# Legal Document Pipeline Configuration — ShrinkLLM
# Teacher: Phi-3-medium | Student: Phi-3-mini → INT4 GPTQ

task: legal
model: microsoft/Phi-3-mini-4k-instruct
teacher: microsoft/Phi-3-medium-4k-instruct

onnx_opset: 17

# GPTQ produces a quantized model *directory*, not an .onnx file, so the ONNX-consuming stages
# (export, convert_*, benchmark) cannot read its output. Listing the stages here keeps the
# default `run_pipeline.py --config configs/legal_pipeline.yaml` runnable; without it the run
# defaults to every stage and aborts on that incompatibility before doing any work.
stages:
  - prune
  - distill
  - quantize

quantization:
  precision: int4  # bit width comes from precision; int4 -> 4 bits
  mode: gptq
  group_size: 128

pruning:
  method: layers
  sparsity: 0.0  # Layer dropping handled by distillation arch

distillation:
  temperature: 4.0
  alpha: 0.2
  beta: 0.8
  gamma: 0.1
  align_hidden: true
  epochs: 5
  batch_size: 4
  lr: 1e-5
  fp16: true

# No `mobile:` block: the convert_* stages are not in `stages` above, so nothing would read it.
# The previous block asked for android format 'gguf' with quantization 'Q4_K_M' — neither is
# supported (convert_to_tflite.py accepts none|fp16|int8, and GGUF is roadmap v1.2), so it would
# have failed the stage on an argparse error had those stages ever run.

benchmark:
  runtime: onnxruntime
  warmup_runs: 5
  benchmark_runs: 50
  dataset: datasets/legal/eval/

success_criteria:
  min_f1: 0.80
  max_size_mb: 800
  max_latency_ms: 3000
  max_accuracy_drop_pct: 5.0
