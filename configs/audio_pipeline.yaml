# Audio Classification Pipeline Configuration — ShrinkLLM
# Teacher: Wav2Vec2-Large | Student: MobileNet Audio / AST-pruned

task: audio
model: MIT/ast-finetuned-audioset-10-10-0.4593
teacher: facebook/wav2vec2-large-960h

onnx_opset: 17

# convert_coreml is omitted: coremltools >= 6 does not accept ONNX input, so the stage raises
# immediately (SHRINK-020, docs/reviews/codebase-audit.md CM1). Add it back once that lands.
stages:
  - prune
  - distill
  - export
  - quantize
  - convert_tflite
  - convert_onnx_mobile
  - benchmark

quantization:
  precision: int8
  mode: static
  calibration_samples: 256
  skip_ops:
    - Softmax
    - LayerNormalization

pruning:
  method: attention_heads
  sparsity: 0.35
  finetune_epochs: 3

distillation:
  temperature: 5.0
  alpha: 0.15
  beta: 0.85
  gamma: 0.0
  epochs: 12
  batch_size: 32
  lr: 5e-5
  fp16: true

mobile:
  android:
    runtime: tflite
    quantization: int8
  ios:
    deployment_target: iOS16
    compute_units: CPU_AND_NE
    quantization: fp16

benchmark:
  runtime: onnxruntime
  warmup_runs: 20
  benchmark_runs: 200
  dataset: datasets/audio/eval/

success_criteria:
  min_accuracy: 0.88
  max_size_mb: 20
  max_latency_ms: 100
  max_accuracy_drop_pct: 4.0
